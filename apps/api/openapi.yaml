openapi: 3.1.0
info:
  title: Xivoo API
  version: 0.1.0
  description: >
    REST API for the Xivoo storefront and admin panel. All prices are integer
    taka (BDT). Prices, stock and coupons are authoritative here — clients never
    compute totals. Demo build uses an in-memory store seeded from the design
    handoff; production swaps in PostgreSQL + Prisma behind the same contract.
servers:
  - url: http://localhost:4000/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from POST /auth/login. Admin endpoints only.
paths:
  /auth/login:
    post:
      summary: Admin sign-in
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        '201': { description: "{ token, user: { email, name, role } }. Roles: owner | manager | support." }
        '401': { description: Wrong email or password }
  /auth/logout:
    post: { summary: Invalidate the current token, responses: { '201': { description: OK } } }
  /auth/me:
    get:
      summary: Current admin user
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: OK }, '401': { description: Not signed in } }
  /health:
    get:
      summary: Liveness check
      responses:
        '200': { description: OK }
  /products:
    get:
      summary: List products
      parameters:
        - { name: cat, in: query, schema: { type: string }, description: "Category key (men|women|kids|toys|gifts|seasonal|bundles). 'seasonal' filters by active campaign seasons." }
        - { name: sub, in: query, schema: { type: string }, description: Subcategory label or season key }
        - { name: q, in: query, schema: { type: string }, description: Token search across name/category/colour/description }
        - { name: sort, in: query, schema: { type: string, enum: [new, asc, desc, discount] } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: isNew, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Product array (stock reflects live inventory) }
  /products/{id}:
    get:
      summary: Product detail
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Product, with resolved bundle items and related products }
        '404': { description: Unknown product }
  /categories:
    get: { summary: Categories with live item counts, responses: { '200': { description: OK } } }
  /campaigns:
    get: { summary: Active seasonal campaigns (admin-driven), responses: { '200': { description: OK } } }
  /zones:
    get: { summary: Delivery zones with fees and ETAs, responses: { '200': { description: OK } } }
  /coupons:
    get: { summary: All coupons (admin), responses: { '200': { description: OK } } }
  /coupons/validate:
    post:
      summary: Validate a coupon against a subtotal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties: { code: { type: string }, subtotal: { type: integer } }
      responses:
        '200': { description: "{ valid, discount, message }. Discount = floor(subtotal × pct), capped; one coupon per order." }
  /orders:
    get:
      summary: List orders, newest first (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Match order no / customer name / phone }
      responses:
        '200': { description: OK }
    post:
      summary: Place an order (COD)
      description: >
        Re-validates contact fields (BD mobile ^01[3-9]\d{8}$ after normalisation),
        delivery zone, stock per line and the coupon; decrements stock atomically;
        snapshots name/SKU/variant/unit price per item. Order no XIV-YYMMDD-NNNN.
      responses:
        '201': { description: Created order }
        '400': { description: "{ message, errors: { field: text } }" }
  /orders/{no}:
    get:
      summary: Order detail
      parameters: [{ name: 'no', in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { description: Unknown order } }
  /orders/{no}/status:
    patch:
      summary: Advance or change order status (admin)
      security: [{ bearerAuth: [] }]
      description: "Roles owner/manager only. Validated transitions only: Pending→Confirmed→Processing→Ready for Dispatch→Shipped→Delivered; Cancelled from pre-dispatch states; Delivered→Return Requested→Returned→Refunded."
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string } } }
      responses:
        '200': { description: Updated order }
        '400': { description: Invalid transition }
  /stats/summary:
    get:
      summary: Admin dashboard metrics
      security: [{ bearerAuth: [] }]
      description: Revenue, order counts, status breakdown, revenue by day (30d), category performance, top products by real sales, low-stock variants.
      responses:
        '200': { description: OK }
