$kind: http-request
name: 'manager confirms the order'
method: PATCH
url: '{{base_url}}/orders/{{order_no}}/status'
order: 12000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    { "status": "Confirmed" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Pending → Confirmed succeeds', () => pm.response.to.have.status(200));
      pm.test('status is updated', () => pm.expect(pm.response.json().status).to.eql('Confirmed'));
